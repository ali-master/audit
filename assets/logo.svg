<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="audit">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="472" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="shield" x1="160" y1="92" x2="352" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE3F0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="#FFFFFF" opacity="0.06"/>

  <!-- shield: the assurance / audit mark -->
  <path d="M256 86 L374 130 V252 C374 334 322 392 256 426 C190 392 138 334 138 252 V130 Z"
        fill="url(#shield)" filter="url(#soft)"/>

  <!-- magnifier: the vulnerability hunt -->
  <circle cx="238" cy="228" r="60" fill="none" stroke="#7C3AED" stroke-width="24"/>
  <line x1="283" y1="273" x2="332" y2="322" stroke="#7C3AED" stroke-width="30" stroke-linecap="round"/>
  <!-- verified check inside the lens: confirmed + reachable -->
  <path d="M210 228 l20 21 l38 -44" fill="none" stroke="#06B6D4" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
